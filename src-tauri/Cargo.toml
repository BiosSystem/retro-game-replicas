[package]
name = "biossystem-neon-arcade"
version = "2.2.0"
description = "BiosSystem Neon Arcade - Procedural arcade platform"
authors = ["BiosSystem Open Source Community"]
license = "MIT"
repository = "https://github.com/BiosSystem/retro-game-replicas"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "biossystem_neon_arcade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
